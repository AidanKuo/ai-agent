# Model configuration
model:
  provider: ollama
  name: gemma3:12b
  host: http://localhost:11434
  temperature: 0.3
  think_mode: false

# Scraper configuration
scraper:
  sites:
    - indeed
    - linkedin
    - zip_recruiter
  search_groups:
    # Primary roles — search all of United States
    - name: primary
      daily_quota: 3
      locations:
        - United States
      terms:
        - entry level data analyst
        - junior data analyst
        - data analyst
        - business intelligence analyst
        - analytics engineer
        - reporting analyst
        - data analytics associate
        - junior analytics engineer
        - entry level python developer
        - junior python developer
        - junior software engineer
        - entry level software developer
        - actuarial analyst
        - actuarial assistant
        - entry level actuary
        - actuarial intern
        - insurance analyst
        - risk analyst
        - underwriting analyst
        - pricing analyst
        - junior data engineer
        - entry level data engineer
        - ETL developer
        - new grad data
        - new grad analyst
        - gis analyst
    # IT / Help desk stepping-stone roles — local markets only
    - name: it_support
      daily_quota: 1
      locations:
        - Houston, TX
        - Seattle, WA
        - California
      terms:
        - entry level IT
        - IT support analyst
        - help desk analyst
        - junior IT specialist
        - technical support analyst
        - IT help desk
        - data center technician
        - entry level data center technician
    # Business & operations analyst roles — nationwide
    - name: business_analyst
      daily_quota: 2
      locations:
        - United States
      terms:
        - entry level business analyst
        - junior business analyst
        - business analyst
        - operations analyst
        - junior operations analyst
        - business operations analyst
        - process analyst
        - data operations analyst
    # Finance analyst roles — nationwide (complements FM exam path)
    - name: finance_analyst
      daily_quota: 1
      locations:
        - United States
      terms:
        - entry level financial analyst
        - junior financial analyst
        - financial reporting analyst
        - budget analyst entry level
        - FP&A analyst entry level
        - corporate finance analyst entry level
    # Healthcare & clinical data roles — nationwide (insurance/health industry focus)
    - name: healthcare_data
      daily_quota: 1
      locations:
        - United States
      terms:
        - health data analyst
        - healthcare data analyst entry level
        - clinical data analyst entry level
        - healthcare analytics analyst
        - health informatics analyst
        - population health analyst entry level
    # Pre-actuary stepping-stone roles — Greater Houston area only
    - name: pre_actuary_houston
      daily_quota: 1
      locations:
        - Houston, TX
        - Sugar Land, TX
        - The Woodlands, TX
      terms:
        - entry level pricing analyst
        - actuarial trainee
        - underwriting trainee
        - underwriting assistant
        - entry level insurance analyst
        - insurance data analyst
        - claims data analyst
        - entry level risk analyst
        - entry level financial analyst
        - actuarial data analyst
        - entry level statistical analyst
  is_remote: false        # false = include all jobs (remote + on-site + hybrid)
  hours_old: 48           # only jobs posted in the last 48 hours
  results_per_search: 10  # per site per search term (10 × 4 sites = ~40 per term)

# Scoring thresholds
scoring:
  auto_apply_threshold: 7    # score 7+ → auto_apply; below → rejected

# Profile paths
profile:
  resume: profile/resume.tex
  preferences: profile/preferences.md

# Data paths
data:
  applications_log: data/applications.json
  seen_jobs: data/seen_jobs.json
