# config/portals.yml — Company portal scanner config
#
# Supports Greenhouse, Ashby, and Lever APIs.
# Detection is automatic from careers_url — or provide api: directly.
#
# To add a company:
#   1. Find their careers page URL
#   2. Add an entry below with name + careers_url (or api:)
#   3. Set enabled: false to skip without deleting

# ── Title filter ────────────────────────────────────────────────────────────
# Applied to all companies. Leave positive empty to accept any title.
title_filter:
  positive:
    # Data / analytics roles
    - data analyst
    - analytics analyst
    - analytics engineer
    - BI analyst
    - business intelligence
    - reporting analyst
    - data scientist
    # Business & operations analyst roles
    - business analyst
    - operations analyst
    - process analyst
    # Finance / actuarial roles
    - financial analyst
    - finance analyst
    - actuarial
    - underwriting
    - pricing analyst
    - risk analyst
    # IT / support roles
    - IT support
    - help desk
    - technical support
    # Data engineering roles
    - data engineer
    - ETL
    - GIS analyst
    - geospatial analyst
    # Entry-level signals (pass anything that says new grad / junior / entry level)
    - new grad
    - entry level
    - junior
  negative:
    - senior
    - " sr "
    - "sr."
    - director
    - manager
    - staff
    - principal
    - architect
    - "5+ years"
    - "5 years"
    - "6+ years"
    - "7+ years"
    - "8+ years"
    - "10+ years"
    - VP
    - head of
    - " lead"
    - "III"
    - " IV"
    - account executive
    - account manager
    - recruiter
    - sourcer

# ── Tracked companies ───────────────────────────────────────────────────────

tracked_companies:

  # ── Greenhouse ─────────────────────────────────────────────────────────
  - name: Stripe
    api: https://boards-api.greenhouse.io/v1/boards/stripe/jobs
    enabled: true

  - name: Figma
    api: https://boards-api.greenhouse.io/v1/boards/figma/jobs
    enabled: true

  - name: HubSpot
    api: https://boards-api.greenhouse.io/v1/boards/hubspot/jobs
    enabled: true

  - name: Databricks
    api: https://boards-api.greenhouse.io/v1/boards/databricks/jobs
    enabled: true

  - name: Duolingo
    api: https://boards-api.greenhouse.io/v1/boards/duolingo/jobs
    enabled: true

  - name: Reddit
    api: https://boards-api.greenhouse.io/v1/boards/reddit/jobs
    enabled: true

  - name: Brex
    api: https://boards-api.greenhouse.io/v1/boards/brex/jobs
    enabled: true

  - name: Palantir
    api: https://api.lever.co/v0/postings/palantir   # uses Lever, not Greenhouse
    enabled: true

  - name: Robinhood
    api: https://boards-api.greenhouse.io/v1/boards/robinhood/jobs
    enabled: true

  - name: Coinbase
    api: https://boards-api.greenhouse.io/v1/boards/coinbase/jobs
    enabled: true

  - name: Zendesk
    enabled: false   # uses Workday — no public API

  - name: Grammarly
    api: https://boards-api.greenhouse.io/v1/boards/grammarly/jobs
    enabled: false   # Greenhouse slug returns 404 — may have moved ATS

  - name: Dropbox
    api: https://boards-api.greenhouse.io/v1/boards/dropbox/jobs   # uses Greenhouse
    enabled: true

  - name: Airtable
    api: https://boards-api.greenhouse.io/v1/boards/airtable/jobs   # uses Greenhouse, not Lever
    enabled: true

  # ── Ashby ───────────────────────────────────────────────────────────────
  - name: OpenAI
    api: https://api.ashbyhq.com/posting-api/job-board/openai   # uses Ashby, not Greenhouse
    enabled: true

  - name: Ramp
    careers_url: https://jobs.ashbyhq.com/ramp
    enabled: true

  - name: Linear
    careers_url: https://jobs.ashbyhq.com/linear
    enabled: true

  - name: Retool
    careers_url: https://jobs.ashbyhq.com/retool
    enabled: true

  - name: Mercury
    careers_url: https://jobs.ashbyhq.com/mercury
    enabled: true

  - name: Rippling
    enabled: false   # uses Rippling's own internal ATS — no public API

  - name: Loom
    careers_url: https://jobs.ashbyhq.com/loom
    enabled: true

  - name: Descript
    enabled: false   # ATS undetectable — careers page not returning standard API

  # ── Lever ───────────────────────────────────────────────────────────────
  - name: Plaid
    careers_url: https://jobs.lever.co/plaid
    enabled: true

  - name: Affirm
    enabled: false   # Lever slug returns 404 — may have migrated ATS
