# config/portals.yml — Company portal scanner config
#
# Supports Greenhouse, Ashby, and Lever APIs.
# Detection is automatic from careers_url — or provide api: directly.
#
# To add a company:
#   1. Find their careers page URL
#   2. Add an entry below with name + careers_url (or api:)
#   3. Set enabled: false to skip without deleting

# ── Title filter ────────────────────────────────────────────────────────────
# Applied to all companies. Leave positive empty to accept any title.
title_filter:
  positive:
    - analyst
    - data
    - python
    - sql
    - BI
    - business intelligence
    - reporting
    - actuarial
    - insurance
    - underwriting
    - pricing
    - risk
    - IT support
    - help desk
    - technical support
    - ETL
    - engineer
    - GIS
    - geospatial
    - finance
    - financial
    - operations
  negative:
    - senior
    - director
    - manager
    - staff
    - principal
    - architect
    - "5+ years"
    - "5 years"
    - "6+ years"
    - "7+ years"
    - "8+ years"
    - "10+ years"
    - VP
    - head of
    - lead
    - "III"
    - " IV"

# ── Tracked companies ───────────────────────────────────────────────────────

tracked_companies:

  # ── Greenhouse ─────────────────────────────────────────────────────────
