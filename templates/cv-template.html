<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{name}} — Resume</title>
<style>
  /* ── Page setup ─────────────────────────────────────────────────────────── */
  @page {
    size: letter;
    margin: 0.6in 0.65in 0.6in 0.65in;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10pt;
    line-height: 1.4;
    color: #1a1a1a;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ── Header ─────────────────────────────────────────────────────────────── */
  .header {
    text-align: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid #1a1a1a;
  }

  .header h1 {
    font-size: 20pt;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .contact-line {
    font-size: 9pt;
    color: #333;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 0;
  }

  .contact-line span {
    padding: 0 8px;
    border-right: 1px solid #aaa;
  }

  .contact-line span:last-child {
    border-right: none;
  }

  .contact-line a {
    color: #1a1a1a;
    text-decoration: none;
  }

  /* ── Section ─────────────────────────────────────────────────────────────── */
  .section {
    margin-bottom: 9px;
  }

  .section-title {
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 2px;
    margin-bottom: 5px;
  }

  /* ── Summary ─────────────────────────────────────────────────────────────── */
  .summary p {
    font-size: 9.5pt;
    line-height: 1.45;
  }

  /* ── Entry (project / leadership / education) ───────────────────────────── */
  .entry {
    margin-bottom: 6px;
  }

  .entry:last-child {
    margin-bottom: 0;
  }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .entry-title {
    font-weight: 700;
    font-size: 10pt;
  }

  .entry-date {
    font-size: 9pt;
    color: #444;
    white-space: nowrap;
    margin-left: 8px;
  }

  .entry-meta {
    font-size: 9pt;
    color: #444;
    font-style: italic;
    margin-bottom: 2px;
  }

  /* bullets */
  ul {
    padding-left: 14px;
    margin-top: 2px;
  }

  li {
    font-size: 9.5pt;
    line-height: 1.4;
    margin-bottom: 1px;
  }

  strong {
    font-weight: 700;
  }

  em {
    font-style: italic;
  }

  /* ── Skills ──────────────────────────────────────────────────────────────── */
  .skills-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 2px;
  }

  .skill-row {
    font-size: 9.5pt;
    line-height: 1.4;
  }

  .skill-label {
    font-weight: 700;
  }

  /* ── Core competencies keyword grid ─────────────────────────────────────── */
  .competencies {
    font-size: 9.5pt;
    color: #1a1a1a;
    text-align: center;
    letter-spacing: 0.01em;
  }

  /* ── Education ───────────────────────────────────────────────────────────── */
  .edu-school {
    font-weight: 700;
    font-size: 10pt;
  }

  .edu-degree {
    font-size: 9.5pt;
    margin-top: 1px;
  }

  .edu-coursework {
    font-size: 9pt;
    color: #333;
    margin-top: 2px;
  }
</style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<div class="header">
  <h1>{{name}}</h1>
  <div class="contact-line">
    <span>{{phone}}</span>
    <span><a href="mailto:{{email}}">{{email}}</a></span>
    <span><a href="https://{{linkedin}}">{{linkedin}}</a></span>
    <span><a href="https://{{github}}">{{github}}</a></span>
  </div>
</div>

<!-- ── Body ─────────────────────────────────────────────────────────────────── -->
{{body}}

</body>
</html>
